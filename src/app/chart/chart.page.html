<ion-header *ngIf="!isLandscape">
  <ion-toolbar>
    <ion-title>Trend</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen [ngClass]="{'landscape-fullscreen': isLandscape}">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="loading-overlay" *ngIf="isLoading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="chart-wrapper" [ngClass]="{'chart-wrapper-landscape': isLandscape}">
    <div class="chart-card" [ngClass]="{'chart-card-landscape': isLandscape}">
      <div class="chart-period-bar" *ngIf="!isLoading && sortedSgsCount > 0">
        <p class="chart-period-info">{{ periodSummary }}</p>
        <p class="chart-scroll-hint">Prevucite ulevo/udesno da pomerate vremenski prozor kroz istoriju.</p>
        <div class="period-chips">
          <button
            type="button"
            class="period-chip"
            *ngFor="let preset of windowPresets"
            [class.active]="activeWindowHours === preset.hours"
            (click)="setWindowHours(preset.hours)">
            {{ preset.label }}
          </button>
          <button type="button" class="period-chip" (click)="scrollToLatest()">Najnovije</button>
          <button type="button" class="period-chip" (click)="scrollToOldest()">Najstarije</button>
        </div>
      </div>
      <div class="chart-scroll-host">
        <div class="chart-viewport" [ngClass]="{'chart-viewport-landscape': isLandscape}">
          <canvas
            baseChart
            [type]="'line'"
            [data]="lineChartData"
            [options]="lineChartOptions"
            [legend]="false">
          </canvas>
        </div>
        <div class="chart-scroll" #chartScroll [ngClass]="{'chart-scroll-landscape': isLandscape}">
          <div class="chart-scroll-track" [style.width.px]="totalScrollWidth"></div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
