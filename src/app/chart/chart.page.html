<ion-header *ngIf="!isLandscape">
  <ion-toolbar>
    <ion-title>Trend</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen [ngClass]="{'landscape-fullscreen': isLandscape}">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="loading-overlay" *ngIf="isLoading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="chart-scroll" #chartScroll [ngClass]="{'chart-scroll-landscape': isLandscape}">
    <div class="chart-inner" [style.width.px]="chartWidth">
      <canvas baseChart [type]="'line'" [data]="lineChartData" [options]="lineChartOptions"
        [legend]="false">
      </canvas>
    </div>
  </div>

  <div class="pattern-summary" *ngIf="patternSummary.length > 0 && !isLandscape">
    <div class="pattern-item" *ngFor="let p of patternSummary">{{ p }}</div>
  </div>
</ion-content>
