<ion-header>
  <ion-toolbar>
    <ion-title>Trend</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="filter-bar">
    <ion-segment [value]="hoursFilter.toString()" (ionChange)="onFilterChange($event)">
      <ion-segment-button value="3">
        <ion-label>3h</ion-label>
      </ion-segment-button>
      <ion-segment-button value="6">
        <ion-label>6h</ion-label>
      </ion-segment-button>
      <ion-segment-button value="12">
        <ion-label>12h</ion-label>
      </ion-segment-button>
      <ion-segment-button value="24">
        <ion-label>24h</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <div class="chart-container">
    <canvas baseChart [type]="'line'" [data]="lineChartData" [options]="lineChartOptions"
      [legend]="true">
    </canvas>
  </div>
</ion-content>
