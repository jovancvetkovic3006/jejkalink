<ion-header *ngIf="!isLandscape">
  <ion-toolbar>
    <ion-title>Trend</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen [ngClass]="{'landscape-fullscreen': isLandscape}">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="loading-overlay" *ngIf="isLoading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="chart-wrapper" [ngClass]="{'chart-wrapper-landscape': isLandscape}">
    <div class="chart-card" [ngClass]="{'chart-card-landscape': isLandscape}">
      <div class="chart-scroll-host">
        <div class="chart-scroll" #chartScroll [ngClass]="{'chart-scroll-landscape': isLandscape}">
          <div class="chart-scroll-track" [style.width.px]="totalScrollWidth"></div>
        </div>
        <div class="chart-viewport" [ngClass]="{'chart-viewport-landscape': isLandscape}" [style.width.px]="viewportWidth">
          <canvas
            baseChart
            [type]="'line'"
            [data]="lineChartData"
            [options]="lineChartOptions"
            [legend]="false">
          </canvas>
        </div>
      </div>
    </div>
  </div>
</ion-content>
