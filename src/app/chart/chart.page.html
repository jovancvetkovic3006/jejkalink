<ion-header [ngClass]="{'header-landscape': isLandscape}">
  <ion-toolbar>
    <ion-title *ngIf="!isLandscape">Trend</ion-title>
    <div class="filter-bar" [ngClass]="{'filter-bar-landscape': isLandscape}">
      <ion-segment [value]="hoursFilter.toString()" (ionChange)="onFilterChange($event)">
        <ion-segment-button value="24">
          <ion-label>24h</ion-label>
        </ion-segment-button>
        <ion-segment-button value="168">
          <ion-label>7D</ion-label>
        </ion-segment-button>
        <ion-segment-button value="720">
          <ion-label>1M</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen [ngClass]="{'landscape-fullscreen': isLandscape}">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="loading-overlay" *ngIf="isLoading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="chart-scroll" #chartScroll [ngClass]="{'chart-scroll-landscape': isLandscape}">
    <div class="chart-inner" [style.width.px]="chartWidth">
      <canvas baseChart [type]="'line'" [data]="lineChartData" [options]="lineChartOptions"
        [legend]="false">
      </canvas>
    </div>
  </div>
</ion-content>
