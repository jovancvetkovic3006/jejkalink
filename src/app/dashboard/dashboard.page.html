<ion-header>
  <ion-toolbar>
    <ion-title>Status</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen *ngIf="patientData$ | async as data">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="glucose-display">
    <p *ngIf="data.current" class="glucose-last">Poslednje ocitavanje: {{ data.since ? data.since : 'nedostupno' }}</p>
    <div *ngIf="data.current" class="glucose-number">{{data.current}}</div>
    <ion-spinner *ngIf="!data.current" name="circles"></ion-spinner>
    <div *ngIf="data.current" class="glucose-unit">mmol/L</div>

    <div *ngIf="data.current" class="trend-indicator" [ngClass]="getTrendClass(data.trend)">
      <ion-icon [name]="getTrendIcon(data.trend)"></ion-icon>
      <span>{{ trendText(data.trend) }}</span>
    </div>
  </div>

  <div *ngIf="data.current" class="data-groups">
    <ion-list>
      <ion-item-group>
        <ion-item-divider color="light">
          <ion-label>Glikemija</ion-label>
        </ion-item-divider>
        <ion-item *ngFor="let item of data.glicemia">
          <ion-label>{{ item }}</ion-label>
        </ion-item>
      </ion-item-group>

      <ion-item-group>
        <ion-item-divider color="light">
          <ion-label>Insulin</ion-label>
        </ion-item-divider>
        <ion-item *ngFor="let item of data.insulin">
          <ion-label>{{ item }}</ion-label>
        </ion-item>
      </ion-item-group>

      <ion-item-group>
        <ion-item-divider color="light">
          <ion-label>Senzor</ion-label>
        </ion-item-divider>
        <ion-item *ngFor="let item of data.senzor">
          <ion-label>{{ item }}</ion-label>
        </ion-item>
      </ion-item-group>

      <ion-item-group>
        <ion-item-divider color="light">
          <ion-label>Pumpica</ion-label>
        </ion-item-divider>
        <ion-item *ngFor="let item of data.pump">
          <ion-label>{{ item }}</ion-label>
        </ion-item>
      </ion-item-group>
    </ion-list>
  </div>
</ion-content>
