<ion-content>
  <div class="screen">
    <app-page-tbar
      title="Dan"
      [pill]="datePill"
      [showBack]="true"
      [showForward]="true"
      [forwardDisabled]="dayOffset === 0"
      [onBack]="onPrev"
      [onForward]="onNext"
      statusRight="00:00–24:00"
    ></app-page-tbar>

    <div class="card-surface flush chart-card">
      <app-glass-panel [placeholder]="chartPlaceholder">
        <div class="chart">
          <app-glucose-chart
            [readings]="chartReadings"
            [startMs]="startMs"
            [endMs]="endMs"
            [boluses]="boluses"
          ></app-glucose-chart>
        </div>
      </app-glass-panel>
      <app-coverage-strip
        [coverage]="coverage"
        [periodStart]="periodStart"
        [periodEnd]="periodEnd"
        periodLabel="00:00–24:00"
      ></app-coverage-strip>
    </div>

    <app-metric-grid
      [cells]="displayCells"
      [empty]="metricsEmpty"
      [placeholder]="metricsPlaceholder"
      emptyMessage="Nema pokrivenih očitavanja za ovaj dan"
    ></app-metric-grid>

    <div class="card-surface log">
      <div class="lbl">Dnevnik</div>
      <app-glass-panel [placeholder]="eventsPlaceholder">
        <app-event-row
          *ngFor="let e of displayEvents"
          [time]="eventTime(e)"
          [title]="e.label"
          [subtitle]="e.detail || ''"
          [rightValue]="eventRight(e)"
          [dotColor]="eventDot(e)"
        ></app-event-row>
      </app-glass-panel>
    </div>
  </div>
</ion-content>
