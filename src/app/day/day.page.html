<ion-content
  appTabSwipe
  swipeMode="day"
  [forwardDisabled]="dayOffset === 0"
  (swipePrev)="prevDay()"
  (swipeNext)="nextDay()"
>
  <div class="screen">
    <app-page-tbar
      title="Day"
      [pill]="datePill"
      [showBack]="true"
      [showForward]="true"
      [forwardDisabled]="dayOffset === 0"
      [onBack]="onPrev"
      [onForward]="onNext"
      [statusRight]="dateStatus"
    ></app-page-tbar>

    <div class="card-surface flush chart-card">
      <app-glass-panel [placeholder]="chartPlaceholder" message="No readings for this day">
        <div class="chart">
          <app-glucose-chart
            [readings]="chartReadings"
            [startMs]="startMs"
            [endMs]="endMs"
            [boluses]="boluses"
            [targetLow]="targetLow"
            [targetHigh]="targetHigh"
          ></app-glucose-chart>
        </div>
      </app-glass-panel>
      <app-coverage-strip
        [coverage]="coverage"
        [periodStart]="periodStart"
        [periodEnd]="periodEnd"
        periodLabel="00:00–24:00"
      ></app-coverage-strip>
    </div>

    <app-metric-grid
      [cells]="displayCells"
      [empty]="metricsEmpty"
      [placeholder]="metricsPlaceholder"
      emptyMessage="No covered readings for this day"
    ></app-metric-grid>

    <div class="card-surface log">
      <div class="lbl">Day log</div>
      <app-glass-panel [placeholder]="eventsPlaceholder" message="No entries for this day">
        <app-event-row
          *ngFor="let e of displayEvents"
          [time]="eventTime(e)"
          [title]="e.label"
          [subtitle]="e.detail || ''"
          [rightValue]="eventRight(e)"
          [dotColor]="eventDot(e)"
        ></app-event-row>
      </app-glass-panel>
    </div>
  </div>
</ion-content>
