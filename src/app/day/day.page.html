<ion-content
  appTabSwipe
  swipeMode="day"
  [forwardDisabled]="dayOffset === 0"
  (swipePrev)="prevDay()"
  (swipeNext)="nextDay()"
>
  <div class="screen">
    <app-page-tbar
      title="Day"
      [pill]="datePill"
      [showBack]="true"
      [showForward]="true"
      [forwardDisabled]="dayOffset === 0"
      [onBack]="onPrev"
      [onForward]="onNext"
      [statusRight]="dateStatus"
    ></app-page-tbar>

    <div class="card-surface flush chart-card">
      <app-glass-panel [placeholder]="chartPlaceholder" message="No data yet">
        <div class="chart">
          <app-glucose-chart
            [readings]="chartReadings"
            [startMs]="startMs"
            [endMs]="endMs"
            [boluses]="boluses"
            [targetLow]="targetLow"
            [targetHigh]="targetHigh"
            [title]="chartTitle"
          ></app-glucose-chart>
        </div>
        <app-coverage-strip
          [coverage]="coverage"
          [periodStart]="periodStart"
          [periodEnd]="periodEnd"
          periodLabel="00:00–24:00"
        ></app-coverage-strip>
      </app-glass-panel>
    </div>

    <app-metric-grid
      [cells]="displayCells"
      [empty]="metricsEmpty"
      [placeholder]="metricsPlaceholder"
      emptyMessage="No data yet"
    ></app-metric-grid>

    <div class="card-surface log">
      <div class="lbl">Add note</div>
      <div class="note-bar">
        <div class="tag-row">
          <button
            type="button"
            *ngFor="let t of tagOptions"
            class="tag-chip"
            [class.on]="noteTag === t.id"
            (click)="selectTag(t.id)"
          >
            {{ t.label }}
          </button>
        </div>
        <div class="note-input-row">
          <input
            type="text"
            class="note-input"
            [(ngModel)]="noteText"
            placeholder="What happened today?"
            maxlength="500"
            (keyup.enter)="addNote()"
          />
          <button type="button" class="chip-pill" (click)="addNote()">Add</button>
        </div>
      </div>
    </div>

    <div class="card-surface log">
      <div class="lbl">Day log</div>
      <app-glass-panel [placeholder]="eventsPlaceholder" message="No data yet">
        <cdk-virtual-scroll-viewport
          *ngIf="!eventsPlaceholder; else dayLogPh"
          itemSize="56"
          class="virt-log"
        >
          <div
            *cdkVirtualFor="let e of displayEvents; trackBy: trackEvent"
            class="log-row-wrap"
          >
            <app-event-row
              [time]="eventTime(e)"
              [title]="e.label"
              [subtitle]="e.detail || ''"
              [rightValue]="eventRight(e)"
              [dotColor]="eventDot(e)"
            ></app-event-row>
            <button
              *ngIf="isNote(e)"
              type="button"
              class="note-remove"
              (click)="removeNote(noteId(e))"
              aria-label="Remove note"
            >
              ×
            </button>
          </div>
        </cdk-virtual-scroll-viewport>
        <ng-template #dayLogPh>
          <app-event-row
            *ngFor="let e of displayEvents"
            [time]="eventTime(e)"
            [title]="e.label"
            [subtitle]="e.detail || ''"
            [rightValue]="eventRight(e)"
            [dotColor]="eventDot(e)"
          ></app-event-row>
        </ng-template>
      </app-glass-panel>
    </div>
  </div>
</ion-content>
