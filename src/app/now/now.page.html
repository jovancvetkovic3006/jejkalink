<ion-content appTabSwipe>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="screen">
    <app-page-tbar
      title="Now"
      [pill]="whoPill"
      [statusRight]="pollStatus"
    ></app-page-tbar>

    <div class="card-surface hero-card">
      <app-glass-panel [placeholder]="heroPlaceholder" message="No reading yet">
        <div class="hero">
          <div class="val numeral" [style.color]="rangeColor">{{ value }}</div>
          <div class="unit">{{ unit }}</div>
          <app-trend-arrow
            [trend]="trend"
            [slopePerMin]="slopePerMin"
            [color]="trendColor"
          ></app-trend-arrow>
        </div>
        <div class="chips">
          <span class="chip ok" [style.color]="rangeColor">{{ rangeText }}</span>
          <app-stale-chip [minutesAgo]="minutesAgo"></app-stale-chip>
          <span class="chip" *ngIf="projectionChip">{{ projectionChip }}</span>
        </div>
      </app-glass-panel>
      <app-coverage-strip
        [coverage]="coverage"
        [periodStart]="dayStart"
        [periodEnd]="dayEnd"
        [periodLabel]="periodLabel"
      ></app-coverage-strip>
    </div>

    <div class="card-surface flush spark-card">
      <div class="lbl">Last 3 hours</div>
      <app-glass-panel [placeholder]="sparkPlaceholder" message="No data for this period">
        <div class="spark">
          <app-glucose-chart
            [readings]="sparkReadings"
            [startMs]="sparkStart"
            [endMs]="sparkEnd"
            [sparkline]="true"
            [targetLow]="targetLow"
            [targetHigh]="targetHigh"
          ></app-glucose-chart>
        </div>
      </app-glass-panel>
    </div>

    <div class="card-surface">
      <div class="lbl">Recent events</div>
      <app-glass-panel [placeholder]="eventsPlaceholder" message="No events yet">
        <app-event-row
          *ngFor="let e of displayEvents"
          [time]="eventTime(e)"
          [title]="e.label"
          [subtitle]="e.detail || ''"
          [dotColor]="eventDot(e)"
        ></app-event-row>
      </app-glass-panel>
    </div>
  </div>
</ion-content>
