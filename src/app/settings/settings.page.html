<ion-header>
  <ion-toolbar>
    <ion-title>Podesavanja</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div class="settings-container">
    <div class="settings-card">
      <div class="card-header">
        <ion-icon name="person-outline" color="primary"></ion-icon>
        <span>Nalog</span>
      </div>
      <ion-list lines="none">
        <ion-item *ngIf="userName">
          <ion-label>Ime</ion-label>
          <ion-note slot="end">{{ userName }}</ion-note>
        </ion-item>
        <ion-item *ngIf="userEmail">
          <ion-label>Email</ion-label>
          <ion-note slot="end">{{ userEmail }}</ion-note>
        </ion-item>
        <ion-item *ngIf="tokenStatus">
          <ion-label>Sesija</ion-label>
          <ion-note slot="end" [color]="tokenStatus === 'Istekao' ? 'danger' : 'success'">{{ tokenStatus }}</ion-note>
        </ion-item>
        <ion-item>
          <ion-input
            label="Pacijent"
            labelPlacement="stacked"
            [(ngModel)]="patientUsername"
            placeholder="Korisnicko ime pacijenta"
            (ionBlur)="saveUsername()"
          ></ion-input>
        </ion-item>
        <ion-item *ngIf="saved">
          <ion-note color="success">Sacuvano!</ion-note>
        </ion-item>
      </ion-list>
    </div>

    <div class="settings-card">
      <div class="card-header">
        <ion-icon name="information-circle-outline" color="secondary"></ion-icon>
        <span>Aplikacija</span>
      </div>
      <ion-list lines="none">
        <ion-item>
          <ion-label>Verzija</ion-label>
          <ion-note slot="end">{{ appVersion }}</ion-note>
        </ion-item>
        <ion-item>
          <ion-label>JejkaLink</ion-label>
          <ion-note slot="end">Medtronic CarePartner</ion-note>
        </ion-item>
      </ion-list>
    </div>

    <div class="settings-card log-card" *ngIf="debugLog$ | async as logs">
      <div class="card-header" (click)="logsExpanded = !logsExpanded">
        <ion-icon name="code-outline" color="medium"></ion-icon>
        <span>Logovi ({{ logs.length }})</span>
        <ion-icon [name]="logsExpanded ? 'chevron-up-outline' : 'chevron-down-outline'" color="medium" class="expand-icon"></ion-icon>
        <ion-button fill="clear" size="small" color="primary" (click)="sendLogs(); $event.stopPropagation()" class="clear-btn" *ngIf="logsExpanded">
          Posalji
        </ion-button>
        <ion-button fill="clear" size="small" color="medium" (click)="clearLogs(); $event.stopPropagation()" class="clear-btn" *ngIf="logsExpanded">
          Obrisi
        </ion-button>
      </div>
      <div class="log-container" *ngIf="logsExpanded && logs.length > 0">
        <div class="log-entry" *ngFor="let log of logs">{{ log }}</div>
      </div>
      <div class="log-empty" *ngIf="logsExpanded && logs.length === 0">
        Nema logova
      </div>
    </div>

    <div class="settings-card danger-card">
      <ion-list lines="none">
        <ion-item button (click)="logout()" detail="false">
          <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
          <ion-label color="danger">Odjavi se</ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>
</ion-content>
