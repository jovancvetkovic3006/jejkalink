<ion-content appTabSwipe>
  <div class="screen">
    <app-page-tbar
      title="Trendovi"
      [pill]="periodPill"
      statusRight="7 · 14 · 30 · 90"
    ></app-page-tbar>

    <ion-segment [value]="days" (ionChange)="onPeriodChange($event)">
      <ion-segment-button [value]="7"><ion-label>7d</ion-label></ion-segment-button>
      <ion-segment-button [value]="14"><ion-label>14d</ion-label></ion-segment-button>
      <ion-segment-button [value]="30"><ion-label>30d</ion-label></ion-segment-button>
      <ion-segment-button [value]="90"><ion-label>90d</ion-label></ion-segment-button>
    </ion-segment>

    <div class="card-surface flush agp-card">
      <div class="lbl" style="padding-left: 4px">Tipičan dan · medijana i raspon</div>
      <app-glass-panel [placeholder]="agpPlaceholder">
        <app-agp-chart [buckets]="agpBuckets" [usePlaceholder]="agpPlaceholder"></app-agp-chart>
      </app-glass-panel>
      <app-coverage-strip
        [coverage]="coverage"
        [periodStart]="periodStart"
        [periodEnd]="periodEnd"
        [periodLabel]="periodPill"
      ></app-coverage-strip>
    </div>

    <div class="card-surface">
      <div class="lbl">Vreme u opsegu</div>
      <div class="rb">
        <i
          *ngFor="let b of rangeBars"
          [style.flex]="b.pct || 0.01"
          [style.background]="b.color"
          >{{ b.pct >= 8 ? b.pct + '%' : '' }}</i
        >
      </div>
      <div class="rkey">
        <div *ngFor="let b of rangeBars">
          <s [style.background]="b.color"></s>
          <span>{{ b.label }}</span>
          <b class="numeral">{{ b.pct }}%</b>
        </div>
      </div>
    </div>

    <app-metric-grid
      [cells]="displayCells"
      [empty]="metricsEmpty"
      [placeholder]="metricsPlaceholder"
      emptyMessage="Potrebno je više očitavanja za trendove"
    ></app-metric-grid>

    <div class="ai-card">
      <div class="lbl">Nedeljni pregled</div>
      <p>{{ weeklyReadP1 }}</p>
      <p>{{ weeklyReadP2 }}</p>
      <div class="q">{{ weeklyReadQ }}</div>
    </div>
  </div>
</ion-content>
