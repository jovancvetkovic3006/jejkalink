<ion-content appTabSwipe>
  <div class="screen">
    <app-page-tbar
      title="Trendovi"
      [pill]="periodPill"
      statusRight="7 · 14 · 30 · 90"
      [onPill]="cyclePeriod"
    ></app-page-tbar>

    <div class="card-surface flush agp-card">
      <div class="lbl" style="padding-left: 4px">Tipičan dan · medijana i raspon</div>
      <app-glass-panel [placeholder]="agpPlaceholder">
        <app-agp-chart [buckets]="agpBuckets" [usePlaceholder]="agpPlaceholder"></app-agp-chart>
      </app-glass-panel>
      <app-coverage-strip
        [coverage]="coverage"
        [periodStart]="periodStart"
        [periodEnd]="periodEnd"
        [periodLabel]="coveragePeriodLabel"
      ></app-coverage-strip>
    </div>

    <div class="card-surface">
      <div class="lbl">Vreme u opsegu</div>
      <div class="rb">
        <i
          *ngFor="let b of rangeBars"
          [style.flex]="b.pct || 0.01"
          [style.background]="b.color"
          >{{ b.pct >= 8 ? b.pct + '%' : '' }}</i
        >
      </div>
      <div class="rkey">
        <div *ngFor="let b of rangeBars">
          <s [style.background]="b.color"></s>
          <span>{{ b.label }}</span>
          <b class="numeral">{{ b.pct }}%</b>
        </div>
      </div>
    </div>

    <app-metric-grid
      [cells]="displayCells"
      [empty]="metricsEmpty"
      [placeholder]="metricsPlaceholder"
      emptyMessage="Potrebno je više očitavanja za trendove"
    ></app-metric-grid>

    <div class="ai-card">
      <div class="lbl">
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
        >
          <path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18" />
        </svg>
        Nedeljni pregled
      </div>
      <p>{{ weeklyReadP1 }}</p>
      <p>{{ weeklyReadP2 }}</p>
      <div class="q">{{ weeklyReadQ }}</div>
    </div>
  </div>
</ion-content>
